services:

  # ── Banco de dados principal ─────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - chatbot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_KEY: ${API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
      TAPE_API_TOKEN: ${TAPE_API_TOKEN}
      TAPE_SYNC_SCHEDULE_ENABLED: ${TAPE_SYNC_SCHEDULE_ENABLED:-true}
      TAPE_SYNC_INTERVAL_HOURS: ${TAPE_SYNC_INTERVAL_HOURS:-24}
      TAPE_SYNC_RUN_ON_STARTUP: ${TAPE_SYNC_RUN_ON_STARTUP:-false}
      N8N_HEALTH_URL: ${N8N_HEALTH_URL:-http://n8n:5678/healthz/readiness}
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:-http://n8n:5678/webhook/9db5ead4-d4ca-4f5c-a1b4-3969e60cb8df/chat}
      N8N_GATEWAY_TOKEN: ${N8N_GATEWAY_TOKEN:-}
      # OIDC — Keycloak do projeto keycloak-central (fora deste compose).
      # DEV: localhost:8081 é o issuer que o Keycloak coloca nos tokens; o backend
      # alcança o host pelo extra_hosts (localhost → host-gateway).
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8081/realms/gentil-dev}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-chat-bot-om-bff}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?defina OIDC_CLIENT_SECRET no .env}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:5173/auth/callback}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:5173/login}
      KEYCLOAK_CONSOLE_URL: ${KEYCLOAK_CONSOLE_URL:-http://localhost:8081/admin/gentil-dev/console/}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?defina SESSION_ENCRYPTION_KEY no .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      SESSION_ABSOLUTE_TIMEOUT_HOURS: ${SESSION_ABSOLUTE_TIMEOUT_HOURS:-8}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://frontend:5173}
      TZ: America/Fortaleza
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - asset_documents_data:/app/storage/assets_documents
      # Novas migrações criadas dentro do container (alembic revision) caem no repositório.
      - ./backend/migrations:/app/migrations
    ports:
      - "127.0.0.1:8040:8000"
    # Permite que o container resolva "localhost" como o host Docker
    # para alcançar o Keycloak do keycloak-central em localhost:8081 (DEV).
    extra_hosts:
      - "localhost:host-gateway"

  # ── Frontend (React + Vite) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    restart: unless-stopped
    environment:
      # Proxy Vite interno aponta para o serviço backend pelo hostname Docker
      BACKEND_TARGET: http://backend:8000
      # Pasta montada do Windows não gera eventos de arquivo: o Vite confere por polling.
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # ── n8n ──────────────────────────────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=America/Fortaleza
      - GENERIC_TIMEZONE=America/Fortaleza
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n

  # ── QA (profile opcional) ────────────────────────────────────────────────────
  qa:
    build:
      context: .
      dockerfile: qa/Dockerfile
    profiles: [qa]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      QA_N8N_WEBHOOK_URL: http://n8n:5678/webhook/9db5ead4-d4ca-4f5c-a1b4-3969e60cb8df/chat
      QA_BACKEND_URL: http://backend:8000
      API_KEY: ${API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      n8n:
        condition: service_started
    volumes:
      - ./qa/reports:/app/qa/reports

volumes:
  chatbot_postgres_data:
  n8n_data:
  asset_documents_data:
  frontend_node_modules:
