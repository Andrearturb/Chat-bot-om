# Tema de login do Chat-bot O&M (Keycloak 26.2.x).
# Herda o comportamento do tema "base" e aplica a identidade visual do app.
parent=base
import=common/keycloak

locales=pt-BR

styles=css/gentil-om.css
meta=viewport==width=device-width,initial-scale=1

## Estrutura
kcHtmlClass=om-html
kcBodyClass=om-body
kcLoginClass=om-login
kcFormCardClass=om-card
kcContentWrapperClass=om-content-wrapper

## Formulários
kcFormClass=om-form
kcFormGroupClass=om-form-group
kcFormGroupErrorClass=om-form-group--error
kcLabelClass=om-label
kcLabelWrapperClass=om-label-wrapper
kcInputClass=om-input
kcInputWrapperClass=om-input-wrapper
kcInputGroup=om-input-group
kcInputErrorMessageClass=om-input-error
kcInputHelperTextBeforeClass=om-helper-text
kcInputHelperTextAfterClass=om-helper-text
kcInputClassCheckbox=om-check
kcInputClassCheckboxInput=om-check__input
kcInputClassCheckboxLabel=om-check__label
kcInputClassRadio=om-check
kcInputClassRadioInput=om-check__input
kcInputClassRadioLabel=om-check__label
kcCheckboxInputClass=om-check__input
kcFormSettingClass=om-form-settings
kcFormOptionsClass=om-form-options
kcFormOptionsWrapperClass=om-form-options__wrapper
kcFormButtonsClass=om-form-buttons
kcSignUpClass=om-info
kcInfoAreaWrapperClass=om-info__wrapper

## Mostrar/ocultar senha (passwordVisibility.js do tema base troca estas classes)
kcFormPasswordVisibilityButtonClass=om-password-toggle
kcFormPasswordVisibilityIconShow=om-icon om-icon--eye
kcFormPasswordVisibilityIconHide=om-icon om-icon--eye-off

## Botões
kcButtonClass=om-button
kcButtonPrimaryClass=om-button--primary
kcButtonDefaultClass=om-button--secondary
kcButtonBlockClass=om-button--block
kcButtonLargeClass=om-button--large

## Alertas
kcAlertClass=om-alert
kcAlertTitleClass=om-alert__text
kcFeedbackErrorIcon=om-alert__icon
kcFeedbackWarningIcon=om-alert__icon
kcFeedbackSuccessIcon=om-alert__icon
kcFeedbackInfoIcon=om-alert__icon
kcResetFlowIcon=om-icon om-icon--restart

## Provedores externos (caso o realm corporativo use SSO federado)
kcFormSocialAccountSectionClass=om-social
kcFormSocialAccountListClass=om-social__list
kcFormSocialAccountListGridClass=om-social__list--grid
kcFormSocialAccountListButtonClass=om-button om-button--secondary om-button--block
kcFormSocialAccountListButtonDisabledClass=om-button--disabled
kcFormSocialAccountNameClass=om-social__name
kcFormSocialAccountGridItem=om-social__item
kcCommonLogoIdP=om-social__logo

## Seleção de autenticador / OTP (páginas herdadas do tema base)
kcSelectAuthListClass=om-select-auth
kcSelectAuthListItemClass=om-select-auth__item
kcSelectAuthListItemIconClass=om-select-auth__icon
kcSelectAuthListItemBodyClass=om-select-auth__body
kcSelectAuthListItemHeadingClass=om-select-auth__heading
kcSelectAuthListItemDescriptionClass=om-select-auth__description
kcSelectAuthListItemArrowClass=om-select-auth__arrow
kcSelectAuthListItemArrowIconClass=om-icon om-icon--chevron
